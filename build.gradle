plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.joyz.autoscrolljoy'
    compileSdk 35

    defaultConfig {
        applicationId "com.joyz.autoscrolljoy"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            // Dimatikan supaya build pertama pasti lolos. Aktifkan bila ingin APK lebih kecil,
            // lalu uji ulang (ML Kit & CameraX membawa consumer rules sendiri).
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Untuk pemakaian pribadi: tanda tangani dengan kunci debug agar APK release bisa langsung
            // dipasang. Ganti dengan keystore sendiri bila ingin dirilis.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // AndroidX & Material 3
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'com.google.android.material:material:1.12.0'

    // Service yang punya Lifecycle (dipakai CameraX di dalam foreground service)
    implementation 'androidx.lifecycle:lifecycle-service:2.8.7'

    // CameraX (hanya ImageAnalysis, tanpa preview)
    def camerax_version = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"

    // Google ML Kit Face Detection (model ikut di dalam APK, jalan offline)
    implementation 'com.google.mlkit:face-detection:16.1.7'
}
